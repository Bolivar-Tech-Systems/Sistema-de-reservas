name: Deploy a Producción

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy al servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/Proyecto1/Sistema-de-reservas

            # Actualizar código
            git pull origin main

            # Backend - reinstalar dependencias si cambiaron
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt -q
            sudo systemctl restart fastapi

            # Frontend - rebuild y recopiar
            cd ../frontend
            npm install -q
            npm run build
            sudo rm -rf /var/www/reservas/admin/*
            sudo cp -r dist/* /var/www/reservas/admin/
            sudo chown -R www-data:www-data /var/www/reservas/

            echo "Deploy completado exitosamente"
